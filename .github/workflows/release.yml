name: Release Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds + uploads the installer as an artifact

permissions:
  contents: write # create the GitHub Release + upload assets on tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Build + package
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          npm run build
          npm run postbuild:standalone
          npx electron-builder --win --publish never
          ls -lh dist

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: VidalyseSetup
          path: |
            dist/VidalyseSetup.exe
            dist/VidalyseSetup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VidalyseSetup.exe
            dist/VidalyseSetup.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
