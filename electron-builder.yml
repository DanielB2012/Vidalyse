appId: com.vidalyse.app
productName: Vidalyse
copyright: © Vidalyse

directories:
  app: dist-app # the whole runtime, assembled by electron/scripts/assemble-standalone.mjs
  output: dist
  buildResources: build

asar: false # server.js is spawned as a real file; native .node modules load from disk
npmRebuild: false # node_modules is already built for the bundled node.exe
afterPack: electron/scripts/after-pack.js # restores .next/node_modules

files:
  - "**/*"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.md"

win:
  target:
    - target: nsis
      arch: [x64]
  # Drop build/icon.ico (256x256) to brand the app; Electron's default icon
  # is used until then.

nsis:
  oneClick: false
  perMachine: false # per-user install, no admin / UAC
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vidalyse

publish:
  provider: github
  owner: danielb2012
  repo: Vidalyse
  releaseType: release
